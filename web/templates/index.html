<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Răcire Baterii</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        .temp-text { font-size: 48px; font-weight: bold; color: #ff5722; margin: 10px 0; }
    </style>
    <script>
        // Functia care cere temperatura de la Python si o afiseaza pe ecran
        function updateTemp() {
            fetch('/api/temp')
            .then(response => response.json())
            .then(data => {
                document.getElementById('temp').innerText = data.temperatura + " °C";
            });
        }
        // Repetam functia la fiecare 2 secunde
        setInterval(updateTemp, 2000);
    </script>
</head>
<body>
    <div class="card">
        <h1>Sistem Răcire EV (PoC)</h1>
        <p>Temperatura bateriilor:</p>
        <div class="temp-text" id="temp">-- °C</div>
    </div>
</body>
</html>
