---
- name: Configurare Server IoT Licenta
  hosts: iot_server
  become: yes # Rulează totul cu drepturi de administrator (sudo)

  tasks:
    - name: 1. Actualizare pachete sistem
      apt:
        update_cache: yes

    - name: 2. Instalare dependente (Git, Docker, Docker-Compose)
      apt:
        name:
          - git
          - curl
          - docker.io
          - docker-compose
        state: present

    - name: 3. Pornire serviciu Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: 4. Permisiuni Docker pentru utilizatorul ubuntu
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: 5. Clonare cod de pe GitHub
      git:
        repo: 'https://github.com/NyDaw/Licenta_IoT_AWS' # !!! INLOCUIESTE CU LINK-UL TAU REAL !!!
        dest: /home/ubuntu/licenta_iot
        version: main
        force: yes
      become_user: ubuntu

    - name: 6. Pornire Broker MQTT (Mosquitto) cu Docker-Compose
      command: docker-compose up -d
      args:
        chdir: /home/ubuntu/licenta_iot/docker